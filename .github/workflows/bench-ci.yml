# Generated by evals/orch/lib/bench-repo.mjs for one benchmark attempt.
name: bench-ci
on:
  pull_request:
permissions:
  contents: read
jobs:
  gates:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Setup
        run: |
          python3 -m venv .venv && SETUPTOOLS_SCM_PRETEND_VERSION=10.0.0.dev0 .venv/bin/python -m pip install -q -e '.[dev]'
      - name: Gates
        run: |
          PATH="$PWD/.venv/bin:$PATH" PYTHONPATH="$PWD/src" python -m pytest -q -p no:cacheprovider testing/test_skipping.py testing/test_collection.py
